[tox]
requires =
    tox>=4.2
    tox-gh-actions
    tox-uv>=1.20.2
env_list =
    lint
    pkg_meta
    d{60, 52}-py{314, 313}
skip_missing_interpreters = true

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    d52: django==5.2.*
    d60: django==6.0.*
pass_env =
    CI
    DATABASE_URL
    PGHOST
    PGPORT
    PYTHONDONTWRITEBYTECODE
    RABBIT_SERVER
set_env =
    BROKER_URL = rabbit://localhost:10000?vhost=pytest&exchange=test_stream
    DJANGO_SETTINGS_MODULE = demo.settings
    PYTHONDONTWRITEBYTECODE = 1
    PYTHONWARNINGS = ignore::DeprecationWarning
    RABBIT_SERVER = localhost:10000
commands =
    {posargs:pytest tests -rw --headless --cov-report=xml  --junit-xml=junit.xml -o junit_family=legacy}
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
pass_env =
    HOMEPATH
    PROGRAMDATA
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:pkg_meta]
description = check that the long description is valid
skip_install = true
deps =
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.5
commands =
    uv build --sdist --wheel --out-dir {env_tmp_dir} .
    twine check {env_tmp_dir}{/}*
    check-wheel-contents --ignore W004 --no-config {env_tmp_dir}
